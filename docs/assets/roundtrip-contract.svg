<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Preservation capsule contract</title>
  <desc id="desc">Conversion emits a native framework projection beside a preservation capsule containing complete AgentIR, original skill files, and a SHA-256 manifest. The return path verifies both before restoring. Edited artifacts require review or an explicit native-only import. Integrity hashes are not cryptographic signatures.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="m2 1 5 3.5L2 8" stroke="#647F88" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect width="1280" height="720" rx="24" fill="#F3F6F4"/>
  <g font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="64" y="58" fill="#3F7D70" font-size="13" font-weight="650" letter-spacing="2">THE ROUNDTRIP CONTRACT</text>
    <text x="64" y="112" fill="#142F38" font-size="38" font-weight="650" letter-spacing="-1">Native where it runs. Complete when it returns.</text>
    <text x="64" y="150" fill="#67808A" font-size="18">Runtime compatibility and source preservation travel together, with separate responsibilities.</text>

    <rect x="64" y="234" width="250" height="286" rx="18" fill="white" stroke="#CEDBD7"/>
    <rect x="87" y="258" width="38" height="38" rx="10" fill="#E8F2ED"/>
    <path d="M99 266h9l5 5v17H99Z" stroke="#488A78" stroke-width="1.5" stroke-linejoin="round"/><path d="M108 266v5h5m-11 7h8m-8 5h6" stroke="#488A78" stroke-width="1.5"/>
    <text x="88" y="331" fill="#183A43" font-size="25" font-weight="650">Source skill</text>
    <text x="88" y="361" fill="#748C93" font-size="15">Files + semantic contracts</text>
    <path d="M88 381h202" stroke="#E2E9E6"/>
    <g fill="#527079" font-size="16" font-family="ui-monospace, SFMono-Regular, Consolas, monospace"><text x="88" y="411">SKILL.md</text><text x="88" y="439">scripts/  assets/</text><text x="88" y="467">references/</text><text x="88" y="495">metadata + tools</text></g>

    <path d="M334 376h34V282h48" stroke="#8AA39F" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M368 376v94h48" stroke="#8AA39F" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="364" y="229" fill="#738B91" font-size="13" font-weight="600" letter-spacing="1">CONVERT</text>
    <rect x="438" y="216" width="344" height="156" rx="18" fill="#E4EEF8" stroke="#ADC5DF"/>
    <text x="463" y="253" fill="#33597C" font-size="12" font-weight="650" letter-spacing="1.8">NATIVE PROJECTION</text>
    <text x="463" y="291" fill="#1C3B5D" font-size="25" font-weight="650">Framework artifacts</text>
    <text x="463" y="322" fill="#52718D" font-size="16">Prompts, configuration, workflow</text>
    <text x="463" y="347" fill="#52718D" font-size="16">Runtime capabilities follow the target</text>

    <rect x="438" y="404" width="344" height="182" rx="18" fill="#E4F0E9" stroke="#94BBA7"/>
    <text x="463" y="441" fill="#3D7D66" font-size="12" font-weight="650" letter-spacing="1.8">PRESERVATION CAPSULE</text>
    <g fill="#285342" font-size="18"><text x="463" y="479">Complete AgentIR</text><text x="463" y="509">Original skill files</text><text x="463" y="539">SHA-256 integrity manifest</text></g>
    <text x="463" y="565" fill="#779889" font-size="13" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">.agentskills-bridge/</text>

    <path d="M802 282h30v94h48M802 495h30V376h48" stroke="#8AA39F" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="832" y="229" fill="#738B91" font-size="13" font-weight="600" letter-spacing="1">RETURN</text>
    <rect x="902" y="258" width="314" height="240" rx="18" fill="#173B43"/>
    <circle cx="943" cy="303" r="18" fill="#2C5558"/><path d="m935 303 5 5 10-11" stroke="#B1E2CC" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="927" y="355" fill="#EFF8F5" font-size="27" font-weight="650">Verify, then restore</text>
    <text x="927" y="391" fill="#AEC9CA" font-size="16">Check emitted files and capsule</text>
    <text x="927" y="419" fill="#AEC9CA" font-size="16">Recover the original source bundle</text>
    <path d="M927 441h264" stroke="#34565D"/>
    <text x="927" y="470" fill="#78A5A1" font-size="13">Integrity check · not a signature</text>

    <rect x="64" y="626" width="1152" height="54" rx="12" fill="#E6EAE7"/>
    <circle cx="90" cy="653" r="9" stroke="#8E8D70" stroke-width="1.4"/><path d="M90 648v6m0 3v.2" stroke="#8E8D70" stroke-width="1.5" stroke-linecap="round"/>
    <text x="112" y="659" fill="#586963" font-size="16">Payload changed? Stop and review. Native-only import is an explicit choice.</text>
  </g>
</svg>
