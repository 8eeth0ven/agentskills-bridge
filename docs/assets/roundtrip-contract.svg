<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="740" viewBox="0 0 1280 740" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Independent acceptance and the semantic repair loop</title>
  <desc id="desc">AI analysis derives a source-grounded plan and frozen expectations. AI generates native tools and workflow code. An independent parent verifier compares observed results with expected values and checks the real framework. Expected values are not passed into generated-code subprocesses. Failures return to implementation repair; preservation remains a separate integrity layer.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="m2 1 5 3.5L2 8" stroke="#6F8C8E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect width="1280" height="740" rx="24" fill="#F3F6F4"/>
  <g font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="64" y="58" fill="#3F7E6F" font-size="13" font-weight="650" letter-spacing="2">THE EXECUTION CONTRACT</text>
    <text x="64" y="113" fill="#18343D" font-size="38" font-weight="650" letter-spacing="-.9">Generated code does not grade itself.</text>
    <text x="64" y="151" fill="#6A848D" font-size="18">Expectations stay fixed. Real observations decide whether a migration passes.</text>

    <rect x="64" y="231" width="265" height="272" rx="18" fill="#FFF" stroke="#CDDCD7"/>
    <text x="88" y="270" fill="#718B8B" font-size="12" font-weight="650" letter-spacing="1.7">SOURCE CONTEXT</text>
    <text x="88" y="311" fill="#23464E" font-size="26" font-weight="650">Rules + assets</text>
    <g fill="#5A7880" font-size="16"><text x="88" y="350">Instructions and references</text><text x="88" y="380">Existing implementation</text><text x="88" y="410">Tool contracts and resources</text></g>
    <path d="M88 438h217" stroke="#E0EAE5"/>
    <text x="88" y="471" fill="#7A918D" font-size="14">Readable context, no credentials</text>

    <path d="M348 312h36" stroke="#8DA7A3" stroke-width="1.7" marker-end="url(#arrow)"/>
    <rect x="406" y="204" width="340" height="143" rx="18" fill="#E3F0E9" stroke="#96BCA8"/>
    <text x="431" y="241" fill="#46816C" font-size="12" font-weight="650" letter-spacing="1.5">AI ANALYSIS</text>
    <text x="431" y="278" fill="#275746" font-size="24" font-weight="650">Source-grounded plan</text>
    <text x="431" y="313" fill="#5D8777" font-size="16">Requirements + frozen acceptance</text>

    <path d="M576 357v24" stroke="#8DA7A3" stroke-width="1.7" marker-end="url(#arrow)"/>
    <rect x="406" y="399" width="340" height="157" rx="18" fill="#E6EEF8" stroke="#ADC3DC"/>
    <text x="431" y="436" fill="#4A6B92" font-size="12" font-weight="650" letter-spacing="1.5">AI GENERATION / REPAIR</text>
    <text x="431" y="473" fill="#294A6D" font-size="24" font-weight="650">Native implementation</text>
    <text x="431" y="508" fill="#5C7C9B" font-size="16">Real tools, ordering and branches</text>
    <text x="431" y="534" fill="#5C7C9B" font-size="16">Changed code; unchanged criteria</text>

    <path d="M765 272h30V249h19" stroke="#7EAA97" stroke-width="1.7" marker-end="url(#arrow)"/>
    <text x="781" y="203" fill="#6D8D7D" font-size="11" text-anchor="middle">FROZEN</text>
    <path d="M765 477h49" stroke="#8DA7A3" stroke-width="1.7" marker-end="url(#arrow)"/>
    <rect x="838" y="204" width="378" height="352" rx="18" fill="#173C44"/>
    <text x="863" y="241" fill="#8DBBB2" font-size="12" font-weight="650" letter-spacing="1.4">INDEPENDENT VERIFIER</text>
    <text x="863" y="281" fill="#EDF7F3" font-size="26" font-weight="650">Run. Observe. Compare.</text>
    <g fill="#B3CFCC" font-size="16"><text x="863" y="321">Syntax + target artifacts</text><text x="863" y="351">Source behavior cases</text><text x="863" y="381">Real framework and tool calls</text></g>
    <path d="M863 405h328" stroke="#375B60"/>
    <text x="863" y="438" fill="#91BAB2" font-size="14">Expected values stay in the parent.</text>
    <text x="863" y="465" fill="#91BAB2" font-size="14">Generated code returns actual results.</text>
    <rect x="863" y="490" width="328" height="42" rx="9" fill="#315A55"/>
    <path d="m881 511 5 5 10-11" stroke="#B8E8CA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="908" y="517" fill="#C4EBD6" font-size="16" font-weight="600">PASS → publish verified project</text>

    <path d="M1026 570v34H576v-34" stroke="#8999AA" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
    <rect x="655" y="589" width="290" height="29" rx="14.5" fill="#F3F6F4"/>
    <text x="800" y="609" text-anchor="middle" fill="#6C7F90" font-size="13">FAIL → observed errors return to repair</text>
    <rect x="64" y="656" width="1152" height="44" rx="12" fill="#E5EBE7"/>
    <text x="88" y="684" fill="#607C73" font-size="15">Preservation Capsule protects source integrity. It does not supply the execution verdict.</text>
  </g>
</svg>
