    <rect x="924" y="452" width="268" height="64" rx="10" fill="#203D3E" stroke="#4B8F80" stroke-dasharray="3 4"/>
    <path d="M941 471h18v19h-18Z" stroke="#9ADCCB" stroke-width="1.6"/><path d="m945 481 4 4 6-8" stroke="#9ADCCB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="976" y="480" fill="#B8EDDE" font-size="16" font-weight="600">Preservation capsule</text>
    <text x="976" y="500" fill="#80B5A8" font-size="12">Complete source + integrity manifest</text>

    <path d="M1056 552v24H210v-24" stroke="#4D7F80" stroke-width="1.5" stroke-dasharray="4 5" marker-end="url(#arrow)"/>
    <rect x="432" y="563" width="414" height="26" rx="13" fill="#102632"/>
    <text x="639" y="581" text-anchor="middle" fill="#9AB9BC" font-size="14" letter-spacing=".4">VERIFY  ·  RESTORE  ·  REPEAT</text>
    <circle cx="1201" cy="601" r="3" fill="#87DCC8"/><text x="1187" y="606" text-anchor="end" fill="#597A89" font-size="12" letter-spacing="1">DESIGNED FOR THE WAY BACK</text>
