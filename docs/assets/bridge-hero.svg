<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="680" viewBox="0 0 1280 680" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">agentskills-bridge — understand, implement, execute and repair</title>
  <desc id="desc">Rules parse source skills and preserve assets. AI analyzes requirements and generates real tools and orchestration. Independent execution checks frozen expectations and the native framework. Observed failures feed the repair loop; only passing projects are published as verified.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="680" gradientUnits="userSpaceOnUse"><stop stop-color="#091922"/><stop offset="1" stop-color="#142B39"/></linearGradient>
    <linearGradient id="accent" x1="390" y1="0" x2="1050" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#72DFCA"/><stop offset="1" stop-color="#A4BDF6"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" stroke="#A7C7D1" stroke-opacity=".04"/></pattern>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="m2 1 5 3.5L2 8" stroke="#7DADB1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="1280" height="680" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="680" rx="24" fill="url(#grid)"/>
  <circle cx="1170" cy="80" r="200" fill="#86CFC6" opacity=".025"/>
  <g font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <path d="m64 64 14-14 14 14-14 14Z" stroke="#83E4D0" stroke-width="2"/><path d="m73 64 5-5 5 5-5 5Z" fill="#83E4D0"/>
    <text x="106" y="72" fill="#D8E6EC" font-size="22" font-weight="600">agentskills-bridge</text>
    <text x="1216" y="70" text-anchor="end" fill="#7996A6" font-size="13" font-weight="600" letter-spacing="2">SEMANTIC MIGRATION</text>
    <text x="64" y="163" fill="#F2F7F8" font-size="48" font-weight="650" letter-spacing="-1.2">Understand the skill.</text>
    <text x="64" y="222" fill="#90E4D0" font-size="48" font-weight="650" letter-spacing="-1.2">Build it. Run it. Repair it.</text>
    <text x="66" y="266" fill="#9AB4C0" font-size="20">Rules preserve assets. AI adapts behavior. Execution decides.</text>

    <g stroke="#31505D" fill="#122B37">
      <rect x="64" y="332" width="208" height="190" rx="17"/>
      <rect x="300" y="332" width="208" height="190" rx="17" fill="#18383F" stroke="#49796F"/>
      <rect x="536" y="332" width="208" height="190" rx="17" fill="#19323F" stroke="#456276"/>
      <rect x="772" y="332" width="208" height="190" rx="17" fill="#19363E" stroke="#4C8075"/>
      <rect x="1008" y="332" width="208" height="190" rx="17" fill="#25323F" stroke="#5B6479"/>
    </g>
    <g stroke="url(#accent)" stroke-width="1.8" marker-end="url(#arrow)"><path d="M277 426h17"/><path d="M513 426h17"/><path d="M749 426h17"/><path d="M985 426h17"/></g>
    <g font-size="12" font-weight="650" letter-spacing="1.5"><text x="88" y="365" fill="#7F9DAA">01 / RULES</text><text x="324" y="365" fill="#8FCBB8">02 / AI PLAN</text><text x="560" y="365" fill="#9CBADA">03 / AI CODE</text><text x="796" y="365" fill="#94D4BF">04 / EXECUTION</text><text x="1032" y="365" fill="#ADB7D1">05 / AI REPAIR</text></g>
    <g font-size="25" font-weight="650" fill="#EDF5F7"><text x="88" y="410">Parse</text><text x="324" y="410">Understand</text><text x="560" y="410">Implement</text><text x="796" y="410">Verify</text><text x="1032" y="410">Repair</text></g>
    <g font-size="16" fill="#A4BCC5"><text x="88" y="449">Source + AgentIR</text><text x="88" y="476">Files stay intact</text><text x="324" y="449">Source requirements</text><text x="324" y="476">Frozen expectations</text><text x="560" y="449">Real tool functions</text><text x="560" y="476">Executable workflow</text><text x="796" y="449">Behavior cases</text><text x="796" y="476">Native tool execution</text><text x="1032" y="449">Observed errors</text><text x="1032" y="476">Implementation fixes</text></g>
    <path d="M1112 534v30H640v-30" stroke="#6D8B99" stroke-width="1.5" stroke-dasharray="4 5" marker-end="url(#arrow)"/>
    <rect x="737" y="550" width="286" height="27" rx="13.5" fill="#142B37"/>
    <text x="880" y="569" text-anchor="middle" fill="#9FBAC6" font-size="13" letter-spacing=".3">REPAIR CODE · KEEP EXPECTATIONS FIXED</text>
    <path d="M64 609h1152" stroke="#2B4553"/>
    <circle cx="74" cy="642" r="4" fill="#8FD8BE"/><text x="89" y="648" fill="#B8D6CB" font-size="15">Publish only after independent checks pass.</text>
    <text x="1216" y="648" text-anchor="end" fill="#6F8A9A" font-size="12" letter-spacing="1">SOURCE PRESERVATION + EXECUTION EVIDENCE</text>
  </g>
</svg>
